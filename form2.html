<html>
<head>
<title>NotEzy Unfolding Page</title>
</head>
<hr>
<form action="http://nukeisit.gatech.edu/cgi-bin/form4.cgi"METHOD=POST>
<body bgcolor=Yellow Text=Black>
Unfolding made easy!
<h2></h2>
Please enter your name here: <br>
<input type="text" name="Name" size=50>
<p>
Please enter your e-mail address:<br>
<input type="text" size=50 name="Email">
<p>
Enter the number of energy groups:<br>
<p>
<input type="text" size=50 name="Egroup">
<p>
Check the response matrix you would like to use. 
<menu>
<input type="radio" name="matrix" value="UTA4">UTA4
<input type="radio" name="matrix" value="HEVE4">HEVE4
<input type="radio" name="matrix" value="VHS">VHS
</menu>
<menu>
<input type="checkbox" Name="detector" Value="bare">Bare
<input type="checkbox" Name="detector" Value="2">2 inch
<input type="checkbox" Name="detector" Value="3">3 inch
</menu>
<p>
Enter the maximum number of iterations to be performed
<input type="test" size=10 name="iter">
<hr>
<input type=submit value="Send">
<input type=reset value="Clear">
<hr>
</form>
</body>
</html>
